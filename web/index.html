<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7c6cf0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>OmeClaw — 你的AI分身</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪼</text></svg>">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 主内容区 -->
    <main class="content">
      <!-- 💬 对话页 -->
      <div id="view-chat" class="view active">
        <div class="chat-header">
          <div class="avatar-status">
            <div class="avatar" id="avatar">🪼</div>
            <div class="status-indicator" id="status-indicator"></div>
          </div>
          <div class="header-info">
            <h1 id="agent-name">小O</h1>
            <p id="agent-status">在线</p>
          </div>
          <div class="header-actions">
            <button class="icon-btn" id="tts-toggle" title="语音播报">🔇</button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
        <div class="daily-topic" id="daily-topic" style="display:none">
          <span class="topic-icon">💭</span>
          <span class="topic-text" id="topic-text"></span>
        </div>
        <form id="chat-form" class="chat-input-bar">
          <button type="button" class="voice-btn" id="voice-btn">
            <span class="voice-icon">🎤</span>
            <span class="voice-wave" id="voice-wave"></span>
          </button>
          <input type="text" id="chat-input" placeholder="说点什么…">
          <button type="submit" class="send-btn" id="send-btn">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M2,10 L18,2 L10,18 L8,12 L2,10 Z"/></svg>
          </button>
        </form>
      </div>

      <!-- 🧠 记忆页 -->
      <div id="view-memory" class="view">
        <div class="view-header-simple">
          <h2>🧠 记忆核心</h2>
          <div class="header-btns">
            <button class="icon-btn" id="import-btn">📥</button>
            <button class="icon-btn" id="share-btn">📤</button>
          </div>
        </div>
        <div class="memory-hero">
          <canvas id="memory-planet" width="200" height="200"></canvas>
          <div class="memory-stats">
            <div class="stat-item">
              <span class="stat-value" id="memory-pct">0%</span>
              <span class="stat-label">完成度</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="memory-count">0</span>
              <span class="stat-label">记忆</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="memory-layers">0/11</span>
              <span class="stat-label">维度</span>
            </div>
          </div>
        </div>
        <div class="memory-categories" id="memory-categories"></div>
      </div>

      <!-- 🎯 养成页 -->
      <div id="view-grow" class="view">
        <div class="grow-hero">
          <div class="grow-avatar" id="grow-avatar">🪼</div>
          <h2 id="grow-name">小O</h2>
          <p id="grow-level">初见</p>
        </div>
        <div class="bond-progress-card">
          <div class="bond-bar">
            <div class="bond-fill" id="bond-fill"></div>
          </div>
          <div class="bond-info">
            <span id="bond-xp">0 XP</span>
            <span id="bond-next">→ 认识中 (50 XP)</span>
          </div>
        </div>
        <div class="streak-card">
          <span class="streak-icon">🔥</span>
          <div class="streak-info">
            <span class="streak-num" id="streak-num">0</span>
            <span class="streak-label">天连续对话</span>
          </div>
        </div>
        <div class="achievements-section">
          <h3>🏆 成就</h3>
          <div class="achievements-grid" id="achievements-grid"></div>
        </div>
        <div class="tasks-section">
          <h3>📋 每日任务</h3>
          <div class="tasks-list" id="tasks-list"></div>
        </div>
      </div>

      <!-- 👤 我的页 -->
      <div id="view-me" class="view">
        <div class="view-header-simple">
          <h2>👤 我的</h2>
        </div>
        <div class="settings-list">
          <button class="setting-item" id="mbti-test-btn">
            <span class="setting-icon">🧪</span>
            <span class="setting-text">人格测试</span>
            <span class="setting-arrow">›</span>
          </button>
          <button class="setting-item" id="agents-manage-btn">
            <span class="setting-icon">🧬</span>
            <span class="setting-text">Agent 管理</span>
            <span class="setting-arrow">›</span>
          </button>
          <button class="setting-item" id="activity-log-btn">
            <span class="setting-icon">📡</span>
            <span class="setting-text">系统日志</span>
            <span class="setting-arrow">›</span>
          </button>
          <button class="setting-item" id="theme-btn">
            <span class="setting-icon">🎨</span>
            <span class="setting-text">主题</span>
            <span class="setting-value" id="theme-value">暗黑</span>
          </button>
          <button class="setting-item" id="about-btn">
            <span class="setting-icon">ℹ️</span>
            <span class="setting-text">关于</span>
            <span class="setting-arrow">›</span>
          </button>
        </div>
      </div>

      <!-- Agent 管理（子页面） -->
      <div id="view-agents" class="view subview">
        <div class="subview-header">
          <button class="back-btn" onclick="goBack()">‹</button>
          <h2>Agent 管理</h2>
          <button class="icon-btn" id="create-agent-btn">+</button>
        </div>
        <div class="agents-list" id="agents-list"></div>
      </div>

      <!-- 系统日志（子页面） -->
      <div id="view-activity" class="view subview">
        <div class="subview-header">
          <button class="back-btn" onclick="goBack()">‹</button>
          <h2>系统日志</h2>
          <button class="icon-btn" id="refresh-activity">↻</button>
        </div>
        <div class="activity-timeline" id="activity-timeline"></div>
      </div>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
      <button class="nav-tab active" data-view="chat">
        <span class="tab-icon">💬</span>
        <span class="tab-label">对话</span>
      </button>
      <button class="nav-tab" data-view="memory">
        <span class="tab-icon">🧠</span>
        <span class="tab-label">记忆</span>
      </button>
      <button class="nav-tab" data-view="grow">
        <span class="tab-icon">🎯</span>
        <span class="tab-label">养成</span>
      </button>
      <button class="nav-tab" data-view="me">
        <span class="tab-icon">👤</span>
        <span class="tab-label">我的</span>
      </button>
    </nav>
  </div>

  <!-- 引导弹窗 -->
  <div id="onboarding-modal" class="modal" style="display:none">
    <div class="modal-card onboarding-card">
      <div class="onboarding-logo">🪼</div>
      <h2 id="onboarding-title">初次见面</h2>
      <p id="onboarding-desc">先快速认识一下？</p>
      <div class="onboarding-progress">
        <div class="progress-fill" id="onboarding-progress"></div>
      </div>
      <div id="onboarding-content"></div>
      <div class="onboarding-actions">
        <button class="btn-text" id="onboarding-skip">跳过</button>
        <button class="btn-primary" id="onboarding-next">下一步</button>
      </div>
    </div>
  </div>

  <!-- 通用弹窗 -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-card" id="modal-card"></div>
  </div>

  <!-- Toast 容器 -->
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
