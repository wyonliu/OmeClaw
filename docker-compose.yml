version: '3.8'

services:
  omeclaw:
    build: .
    container_name: omeclaw
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/.omeclaw
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/status', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  data:
    driver: local
